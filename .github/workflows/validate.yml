name: Validate solution source

# Every defect this catches is a defect that would otherwise surface during a
# live run -- and a live run of this solution spends metered agent capacity and
# overwrites documents. Cheap checks here are worth a great deal.

on:
  pull_request:
    paths:
      - 'solution/**'
      - 'harness/**'
      - 'reference-solution/**'
      - 'provisioning/**'
      - 'scripts/**'
      - '.github/workflows/validate.yml'
  push:
    branches: [main]
    paths:
      - 'solution/**'
      - 'harness/**'
      - 'reference-solution/**'
      - 'provisioning/**'
      - 'scripts/**'
      - '.github/workflows/validate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Static validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        # Full history so the reference-solution guard can diff against the
        # base branch. A shallow checkout makes that check skip silently.
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify provisioning template matches lists.json
        run: python3 scripts/generate_pnp_template.py --check

      - name: Verify deployment settings match environment-variables.json
        run: python3 scripts/generate_deployment_settings.py --check

      - name: Verify solution shell matches source configuration
        run: python3 scripts/generate_solution_shell.py --check

      - name: Verify processing flow matches the agent contract generator
        run: python3 scripts/generate_processing_flow.py --check

      - name: Verify rollback flow matches the agent result generator
        run: python3 scripts/generate_rollback_flow.py --check

      - name: Validate flow definitions, columns and configuration
        run: python3 scripts/validate_solution.py

      - name: Validate requirements R1-R7
        run: python3 scripts/validate_requirements.py

      # The reference export is evidence of how the deployed system behaves.
      # Editing it destroys the ability to claim the harness matches production,
      # and being a binary zip, a diff cannot show what changed.
      - name: Verify the reference solution is untouched
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: python3 scripts/check_reference_untouched.py

      - name: Verify harness flow matches its generator
        run: python3 scripts/generate_harness_flow.py --check

      # Regression suite against the reference flow's real defects: the empty
      # exclusion branches, RecursiveAll enumeration, the discarded agent
      # response and the unconditional Succeeded.
      - name: Validate harness
        run: python3 scripts/validate_harness.py

  pack:
    name: Pack Power Platform solution
    runs-on: windows-latest
    needs: validate
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install Power Platform tools
        uses: microsoft/powerplatform-actions/actions-install@v1

      # Proves the unpacked source is structurally valid and importable-shaped.
      # It does not prove the flows run; only an import into a real environment
      # can do that. See solution/README.md for verification status.
      - name: Pack solution (unmanaged)
        uses: microsoft/powerplatform-actions/pack-solution@v1
        with:
          solution-folder: solution/src
          solution-file: out/FileIteratorTemplateRegeneration.zip
          solution-type: Unmanaged

      - name: Upload solution artefact
        uses: actions/upload-artifact@v4
        with:
          name: solution-unmanaged
          path: out/FileIteratorTemplateRegeneration.zip
          if-no-files-found: error

      - name: Pack harness (unmanaged)
        uses: microsoft/powerplatform-actions/pack-solution@v1
        with:
          solution-folder: harness/src
          solution-file: out/PDConversionHarness.zip
          solution-type: Unmanaged

      - name: Upload harness artefact
        uses: actions/upload-artifact@v4
        with:
          name: harness-unmanaged
          path: out/PDConversionHarness.zip
          if-no-files-found: error
